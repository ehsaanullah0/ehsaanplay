name: Update Star History

on:
  schedule:
    - cron: "17 0 * * *"
  watch:
    types: [started]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: star-history
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Generate branded star-history graphics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_star_history.py
      - name: Commit updated graphics
        run: |
          if git diff --quiet -- assets/star-history/star-history-dark.svg assets/star-history/star-history-light.svg; then
            echo "Star history is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/star-history/star-history-dark.svg assets/star-history/star-history-light.svg
          git commit -m "chore: update branded star history [skip ci]"
          git push
