<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="creamBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF8F2"/>
      <stop offset="100%" stop-color="#F2EFE3"/>
    </linearGradient>
  </defs>

  <!-- Outer Rounded Squircle Base in Warm Paper Cream -->
  <rect width="512" height="512" rx="140" fill="url(#creamBg)"/>

  <!-- Outer Subtle Border -->
  <rect x="8" y="8" width="496" height="496" rx="132" fill="none" stroke="#4E562F" stroke-width="12" stroke-opacity="0.15"/>

  <!-- Top Angled Clapper Stick -->
  <g transform="rotate(-6 256 160)">
    <rect x="64" y="80" width="384" height="88" rx="28" fill="#EAE5D8" stroke="#282C1B" stroke-width="20" stroke-linejoin="round"/>
    <line x1="144" y1="80" x2="176" y2="168" stroke="#282C1B" stroke-width="20" stroke-linecap="round"/>
    <line x1="224" y1="80" x2="256" y2="168" stroke="#282C1B" stroke-width="20" stroke-linecap="round"/>
    <line x1="304" y1="80" x2="336" y2="168" stroke="#282C1B" stroke-width="20" stroke-linecap="round"/>
    <line x1="384" y1="80" x2="416" y2="168" stroke="#282C1B" stroke-width="20" stroke-linecap="round"/>
  </g>

  <!-- Main Clapper Body -->
  <rect x="64" y="192" width="384" height="256" rx="48" fill="#FAF8F2" stroke="#282C1B" stroke-width="20" stroke-linejoin="round"/>

  <!-- Centered Play Mark -->
  <polygon points="224,272 224,368 320,320" fill="#4E562F" stroke="#4E562F" stroke-width="12" stroke-linejoin="round"/>
</svg>
