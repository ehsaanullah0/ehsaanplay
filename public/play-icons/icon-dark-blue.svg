<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Outer Rounded Squircle Base (Dark Blue) -->
  <rect width="512" height="512" rx="140" fill="#0D1524"/>

  <!-- Top Angled Clapper Stick -->
  <g transform="rotate(-6 256 160)">
    <rect x="64" y="80" width="384" height="88" rx="28" fill="#19253C" stroke="#ADC8FA" stroke-width="20" stroke-linejoin="round"/>
    <line x1="144" y1="80" x2="176" y2="168" stroke="#ADC8FA" stroke-width="20" stroke-linecap="round"/>
    <line x1="224" y1="80" x2="256" y2="168" stroke="#ADC8FA" stroke-width="20" stroke-linecap="round"/>
    <line x1="304" y1="80" x2="336" y2="168" stroke="#ADC8FA" stroke-width="20" stroke-linecap="round"/>
    <line x1="384" y1="80" x2="416" y2="168" stroke="#ADC8FA" stroke-width="20" stroke-linecap="round"/>
  </g>

  <!-- Main Clapper Body -->
  <rect x="64" y="192" width="384" height="256" rx="48" fill="#19253C" stroke="#ADC8FA" stroke-width="20" stroke-linejoin="round"/>

  <!-- Centered Play Mark -->
  <polygon points="224,272 224,368 320,320" fill="#ADC8FA" stroke="#ADC8FA" stroke-width="12" stroke-linejoin="round"/>
</svg>